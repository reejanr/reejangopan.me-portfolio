<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Mark JS as available (enables scroll reveals) and apply the saved theme before first paint.
      document.documentElement.classList.add("js");
      // Failsafe: if the app hasn't started revealing content within 4s, show everything.
      setTimeout(function () { if (!window.__reveal) document.documentElement.classList.remove("js"); }, 4000);
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Reejan R Gopan" />
    <meta name="application-name" content="Reejan Gopan" />
    <meta name="apple-mobile-web-app-title" content="Reejan Gopan" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="geo.region" content="AE-DU" />
    <meta name="geo.placename" content="Dubai" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable profile" />

    <!--app-head-->
  </head>
  <body>
    <noscript>
      <p style="padding: 16px; margin: 0">Reejan R Gopan — Software &amp; Systems Engineer in Dubai. This site works best with JavaScript enabled; all content is also readable without it.</p>
    </noscript>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
